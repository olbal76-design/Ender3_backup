[gcode_macro END_PRINT]
gcode:
    {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
    {% set x = sensor.park_position_x %}
    {% set y = sensor.park_position_y %}
    {% set z = sensor.park_lift_z %}
    {% set e = sensor.park_retraction %}

    M400                         ; дождаться завершения буфера
    G92 E0                       ; сбросить координату экструдера
    G1 E-{e} F2100               ; ретракт
    G91                          ; относительные координаты
    G1 Z{z} F600                 ; поднять Z
    G90                          ; абсолютные координаты
    G1 X{x} Y{y} F6000           ; парковка
    M400                         ; дождаться окончания движения парковки
    M104 S0                      ; выключить хотенд
    M140 S0                      ; выключить стол
    M107                         ; выключить обдув
    M84                          ; отключить все моторы (X/Y/Z/E)