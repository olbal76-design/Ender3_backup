[gcode_macro COLD_PULL]
description: Cold pull - push while cooling, then heat to release
gcode:
    M118 COLD PULL: Starting — Nylon 270C

    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autoload VALUE=True
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_runout VALUE=True
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autounload VALUE=True
    M118 COLD PULL: Sensor disabled

    M118 COLD PULL: Heating to 270C...
    M104 S270
    M109 S270

    # Purge
    M83
    G92 E0
    G1 E80 F200
    G4 P2000
    M400
    M118 COLD PULL: Purge complete!

    # Kill heater — now user pushes manually while it cools
    M104 S0
    M118 COLD PULL: >>> Heater OFF! Push filament manually now <
    M118 COLD PULL: Keep pushing until filament stops moving (~1-2 min)
    M300
    G4 P500
    M300

    # Wait for user to confirm filament is solidified
    M118 COLD PULL: When filament is solid — run COLD_PULL_HEAT to release

[gcode_macro COLD_PULL_HEAT]
description: Heat to release solidified filament - start pulling when it moves
gcode:
    M118 COLD PULL: Heating to 120C to release filament...
    M104 S120
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=110
    M300
    G4 P300
    M300
    M118 COLD PULL: >>> PULL NOW — slow and steady, straight up! <
    M118 COLD PULL: If stuck — run M104 S130 and keep pulling
    UPDATE_DELAYED_GCODE ID=cold_pull_restore DURATION=60

[delayed_gcode cold_pull_restore]
gcode:
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autoload VALUE=False
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_runout VALUE=False
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autounload VALUE=False
    M104 S0
    M118 COLD PULL: Done! Insert filament to reload or run COLD_PULL again.
    M300

[gcode_macro COLD_PULL_DONE]
description: Call after pulling to restore sensor immediately
gcode:
    UPDATE_DELAYED_GCODE ID=cold_pull_restore DURATION=0
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autoload VALUE=False
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_runout VALUE=False
    SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autounload VALUE=False
    M104 S0
    M118 COLD PULL: Sensor restored. Insert filament to reload.
    M300