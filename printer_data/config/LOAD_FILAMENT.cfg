[gcode_macro LOAD_FILAMENT]
description: Перемещение головы и загрузка филамента
variable_extruder: 230
gcode:
    M117 Подготовка к заправке филамента

    {% if "xyz" not in printer.toolhead.homed_axes %}
        HOME_ALL_CUSTOM
    {% endif %}

    {% set extruder_temp = params.EXTRUDER_TEMP|default(extruder)|float %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 5}

    G90
    G1 X180 Y0 Z150 F6000

    M117 Готово к загрузке филамента
