[gcode_macro NOZZLE_PURGE]
description: Two 100 mm purge strips to clean the nozzle
gcode:
    # Defaults can be overridden: NOZZLE_PURGE X=30 Y=15  or  MIN_X=80 MIN_Y=90 DIST=10
    {% set length = params.LENGTH|default(100)|float %}
    {% set step   = params.STEP|default(0.6)|float %}
    {% set width  = params.WIDTH|default(0.7)|float %}
    {% set height = params.HEIGHT|default(0.3)|float %}
    {% set speed  = params.SPEED|default(30)|float %}
    {% set fil_d  = params.FIL_D|default(1.75)|float %}
    {% set dist   = params.DIST|default(10)|float %}
    {% set x_max  = printer.toolhead.axis_maximum.x|float - length %}
    {% set x0 = [params.MIN_X|default(params.X|default(20))|float, x_max]|min %}
    {% if params.MIN_Y is defined %}
        {% set y0 = [params.MIN_Y|float - dist - step, 2.0]|max %}
    {% else %}
        {% set y0 = params.Y|default(10)|float %}
    {% endif %}
    {% set e = (width * height * length) / (3.14159265 * (fil_d / 2) ** 2) %}
    
    SAVE_GCODE_STATE NAME=NOZZLE_PURGE
    G90
    M83
    G1 Z5 F1200
    G1 X{x0} Y{y0} F6000
    G1 Z{height} F600
    G1 X{x0 + length} E{e|round(3)} F{speed * 60}
    G1 Y{y0 + step} F{speed * 60}
    G1 X{x0} E{e|round(3)} F{speed * 60}
    G1 Z5 F1200
    RESTORE_GCODE_STATE NAME=NOZZLE_PURGE