[gcode_macro HOME_ALL_CUSTOM]
description: Безопасный хоуминг с BLTouch и sensorless X/Y
gcode:
    {% set config = printer.configfile.settings %}
    {% set run_x = config['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = config['tmc2209 stepper_y'].run_current|float %}
    {% set ratio = 0.7 %}

    M117 Homing X/Y... (Lower Current)

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={ratio * run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ratio * run_y}

    G28 X Y

    M117 Homing X/Y Done (Restore Current)
    
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}

    SET_KINEMATIC_POSITION Z=0.0

    M117 Move Z Up/Center
    
    G91
    G1 Z20 F600
    G90

    G1 X150 Y120 F3000

    M117 Homing Z...
    
    G28 Z

    M117 Done! Back to Park
    
    G1 X5 Y5 Z10 F3000
    
    M117 Ready!
