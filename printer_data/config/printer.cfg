# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[include START_PRINT.cfg]
[include END_PRINT.cfg]
[include screen.cfg]
#[include LOAD_FILAMENT.cfg]
#[include btt adxl345 v2.cfg]
#[include _SAFE_PARK.cfg]
[include HOME_ALL_CUSTOM.cfg]
[include Orbiter2_SmartSensor.cfg]
[include COLD_PULL.cfg]
[exclude_object]
[include FILAMENT_CHANGE.cfg]

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop #^PC0 Changed for sensorless homing
#endstop_pin: ^PC0
position_endstop: -10
position_min: -10
position_max: 233 
homing_speed: 20 
homing_retract_dist: 0 
#second_homing_speed: 5

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
diag_pin: ^PC0 #This line added for sensorless homing
driver_SGTHRS: 40 #чем меньше значение, тем грубее настройка 
run_current: 0.58
stealthchop_threshold: 999999 #0

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop #^PC1 Changed for sensorless homing
#endstop_pin: ^PC1
position_endstop: -10 #0
position_max: 222 #238
position_min: -10
homing_speed: 20 #30
homing_retract_dist: 0
#second_homing_speed: 5

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
diag_pin: ^PC1 #This line added for sensorless homing
driver_SGTHRS: 60 #This line added for sensorless homing
run_current: 1
stealthchop_threshold: 0 #999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
#endstop_pin: ^PC2
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.0
position_max: 225 #246
position_min: -2
homing_retract_dist: 5.0
#second_homing_speed: 5

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.4
stealthchop_threshold: 0 #999999

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 4.637
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_extrude_temp: 180
min_temp: 0
max_temp: 320
max_extrude_only_distance: 150

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 0

[idle_timeout]
timeout: 600   # Все двигатели отключатся через 60 секунд простоя

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[mcu]
serial: /dev/ttyS1
baud: 250000

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 2300
#max_accel: 1500 #glass
max_z_velocity: 5
max_z_accel: 100

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[pause_resume]

[gcode_macro CANCEL_PRINT]

[display_status]

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# See the sample-lcd.cfg file for definitions of common LCD displays.

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 50.2

shaper_type_y: ei
shaper_freq_y: 34

# for glass, accel 1500
#shaper_type_y: ei
#shaper_freq_y: 29.2

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -31
y_offset: -9
#z_offset: 3
speed: 5 #3  # Медленное опускание зонда (уменьшите, если нужно еще медленнее)


[screws_tilt_adjust]

screw1: 60, 210 #25, 70 #screw coordinates need to be measure for YOUR specific printer

screw1_name: rear left screw

screw2: 60, 40 #200, 70

screw2_name: front left screw

screw3: 230, 40 #200, 229

screw3_name: front right screw

screw4: 230, 210 #25, 229

screw4_name: rear right screw

horizontal_move_z: 10.

speed: 50. #speed of travel moves between screws

screw_thread: CW-M3 #measure your bed screw m3=3mm / m4=4mm / m5=5mm

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 10
mesh_max: 202, 210
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1
fade_end: 10
adaptive_margin: 5  # Добавляет 5 мм к области печати

[firmware_retraction]
retract_length: 1
retract_speed: 30
unretract_speed: 30

####################################EXTRAS###################################

[force_move] # FORCE_MOVE commands to move the printhead outside of the configured min/max positions or perform moves without first homing.
enable_force_move: True

[gcode_macro DISPLAY_REMAINING_TIME]
description: Updates screen with simple print status (Printing, Paused, Finished).
gcode:
    {% set state = printer.print_stats.state %}

    {% if state == "printing" %}
        M117 Printing...
    {% elif state == "complete" %}
        M117 Print Finished
    {% elif state == "paused" %}
        M117 Print Paused
    {% else %}
        M117 Idle
    {% endif %}

[delayed_gcode display_timer]
initial_duration: 1.0  ; <-- Здесь этот параметр допустим и указывает на запуск через 1 секунду.
gcode:
    DISPLAY_REMAINING_TIME
    UPDATE_DELAYED_GCODE ID=display_timer DURATION=10

